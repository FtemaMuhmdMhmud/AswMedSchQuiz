  .option-btn.wrong { border-color: var(--red); background: #fee2e2; color: #b91c1c; }

  .result-badge.visible { display: flex; align-items: center; gap: 6px; }
  .result-badge.correct-badge { color: var(--green); }
  .result-badge.wrong-badge { color: var(--red); }

  .summary-bar { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 40px; display: flex; gap: 24px; align-items: center; font-size: 0.85rem; color: var(--muted); }

  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-gray { background: #94a3b8; }
  .reset-btn { margin-left: auto; background: var(--primary); color: white; border: none; border-radius: 7px; padding: 7px 18px; font-size: 0.82rem; font-family: 'Source Sans 3', sans-serif; cursor: pointer; font-weight: 600; transition: background 0.15s; }
  .reset-btn:hover { background: var(--accent); }

  .part-section { max-width: 900px; margin: 0 auto; }
</style>

    answer: 0,

    explanation: "<strong>Corneal hypoesthesia</strong> (reduced sensation) is the hallmark of HSV keratitis. The virus damages the trigeminal nerve fibers supplying the cornea. It is highly recurrent, usually unilateral, and rarely perforates unless steroids are misused."

  {

  {

    answer: 1,
    explanation: "The <strong>substantia propria (stroma)</strong> constitutes about 90% of the total corneal thickness (~500 µm of the ~550 µm total). It is composed of regularly arranged collagen lamellae which give the cornea its transparency."
  },
  {

    q: "A 30-year-old male with injury by a leaf 5 days ago, now with pain, photophobia, and redness for 2 days. Most likely pathology:",

  },
  {

  },
  {

  },
  {

  },

  {

  },
  {

    explanation: "<strong>Rheumatoid arthritis</strong> is the most common systemic association with peripheral ulcerative keratitis (PUK). The mechanism is immune-complex deposition causing vasculitis at the limbal vessels. It can lead to corneal melting (keratolysis)."
  },
  {
    part: "Part 2: Corneal Anatomy & Investigations",
    q: "Munson's sign is seen in:",
    options: ["Episcleritis","Chalcosis","Keratoconus","Retinal Detachment"],
    answer: 2,
    explanation: "<strong>Keratoconus</strong> — Munson's sign is the V-shaped indentation of the lower eyelid seen in down-gaze due to the ectatic corneal cone pressing on the lid. It indicates advanced keratoconus."
  },
  {
    part: "Part 2: Corneal Anatomy & Investigations",

  },
  {

    q: "The basement membrane of corneal endothelium is called:",

  },
  {

    explanation: "<strong>Neisseria gonorrhoeae</strong> (Gonococci) is the classic organism that can penetrate an intact, healthy corneal epithelium due to its ability to invade non-phagocytic cells. This leads to rapid, devastating keratitis."

  {

    q: "Dendritic ulcer is found in:",

  },
  {

  },
  {

  },
  {

  },
  {
    part: "Part 3: Specific Conditions & Treatment",
    q: "Predisposing factors of bacterial keratitis include:",
    options: ["Chronic ocular surface disease","Keratoconus","Open angle glaucoma","Retinal detachment"],
    answer: 0,
    explanation: "<strong>Chronic ocular surface disease</strong> (dry eye, blepharitis, exposure keratopathy) disrupts the ocular surface defense mechanisms, predisposing to bacterial keratitis. Contact lens wear is the #1 predisposing factor overall."
  },
  {

    q: "Corneal sensations are diminished in: (repeat)",
    options: ["Herpes simplex infection","Conjunctivitis","Marginal keratitis","Fungal infections"],
    answer: 0,
    explanation: "<strong>Herpes simplex infection</strong> — HSV causes neurotrophic keratopathy by damaging the trigeminal sensory fibers supplying the cornea, resulting in reduced or absent corneal sensation. This is a key differentiating feature."

    options: ["Fungal corneal ulcer","Herpetic corneal ulcer","Exposure keratopathy","Acanthamoeba corneal ulcer"],
    answer: 3,
    explanation: "<strong>Acanthamoeba keratitis</strong> shows a characteristic double staining pattern (ring infiltrate on slit lamp; both rose bengal and fluorescein staining). It is associated with contact lens use in contaminated water."
  },
  {
    part: "Part 4: Keratoconus & Corneal Deposits",
    q: "Blood staining of the cornea is due to:",
    options: ["Hyphema","Hyphema with rise of IOP","Corneal edema","Corneal FB"],
    answer: 1,
    explanation: "<strong>Hyphema with rise of IOP</strong> causes blood staining of the cornea. The elevated pressure drives hemoglobin breakdown products into the stroma. Simple hyphema alone doesn't cause staining unless IOP is also elevated."
  },
  {
    part: "Part 4: Keratoconus & Corneal Deposits",
    q: "All are infective corneal ulcers <em>except</em>:",
    options: ["Typical hypopyon ulcer","Atypical hypopyon ulcer","Fascicular ulcer","Dendritic corneal ulcer"],
    answer: 2,
    explanation: "<strong>Fascicular ulcer</strong> (phlyctenular keratitis) is a <em>non-infective</em>, hypersensitivity-mediated ulcer. The typical and atypical hypopyon ulcers are bacterial; dendritic ulcer is viral. Fascicular ulcer is an immune reaction, not a direct infection."
  },
  {
    part: "Part 4: Keratoconus & Corneal Deposits",
    q: "In corneal edema, all is true <em>except</em>:",
    options: ["There is increase in corneal diameter","There is increase in corneal thickness","Cloudy cornea","Predispose to corneal vascularization"],
    answer: 0,
    explanation: "<strong>Corneal diameter does NOT increase</strong> in corneal edema — the cornea swells in thickness (anteroposteriorly) and becomes hazy/cloudy, but the diameter remains the same. Increased diameter (megalocornea/buphthalmos) is from elevated IOP in infants."
  },
  {
    part: "Part 4: Keratoconus & Corneal Deposits",
    q: "Irrespective of the etiology of a corneal ulcer, the drug always indicated is: (repeat)",
    options: ["Corticosteroids","Atropine","Antibiotics","Antifungals"],
    answer: 1,
    explanation: "<strong>Atropine</strong> (cycloplegic) is universally indicated in all corneal ulcers to relieve ciliary spasm (pain), prevent posterior synechiae, and stabilize the blood-aqueous barrier. Note: this repeat question uses 'Atropine' instead of 'Cycloplegics' — both refer to cycloplegia."
  }
];

let state = {};
let correct = 0, wrong = 0;
const TOTAL = questions.length;

function init() {
  questions.forEach((_, i) => state[i] = null);
  correct = 0; wrong = 0;
  updateStats();
  render();
}

function render() {
  const app = document.getElementById('app');
  const parts = {};
  questions.forEach((q, i) => {
    if (!parts[q.part]) parts[q.part] = [];
    parts[q.part].push({ q, i });
  });

  let html = '';
  Object.entries(parts).forEach(([part, items]) => {
    html += `<div class="part-section"><div class="part-header"><h2>${part}</h2></div><div class="questions-container">`;
    items.forEach(({ q, i }) => {
      const letters = ['a','b','c','d','e'];
      let cardClass = '';
      if (state[i] !== null) cardClass = state[i] === q.answer ? 'answered-correct' : 'answered-wrong';
      html += `<div class="q-card ${cardClass}" id="card-${i}">
        <div class="q-header"><div class="q-num">${i+1}</div><div class="q-text">${q.q}</div></div>
        <div class="options">`;
      q.options.forEach((opt, j) => {
        let btnClass = '';
        if (state[i] !== null) {
          if (j === q.answer) btnClass = state[i] === j ? 'correct' : 'reveal-correct';
          else if (j === state[i]) btnClass = 'wrong';
        }
        html += `<button class="option-btn ${btnClass}" ${state[i]!==null?'disabled':''} onclick="answer(${i},${j})">
          <span class="option-letter">${letters[j]}</span>${opt}</button>`;
      });
      html += `</div>`;
      if (state[i] !== null) {
        const ok = state[i] === q.answer;
        html += `<div class="result-badge visible ${ok?'correct-badge':'wrong-badge'}">${ok?'✓ Correct!':'✗ Incorrect'}</div>`;
      } else {
        html += `<div class="result-badge"></div>`;
      }
      const expVisible = state[i] !== null ? 'visible' : '';
      html += `<div class="explanation ${expVisible}">💡 ${q.explanation}</div></div>`;
    });
    html += `</div></div>`;
  });
  app.innerHTML = html;
}

function answer(qIndex, optIndex) {
  if (state[qIndex] !== null) return;
  state[qIndex] = optIndex;
  const q = questions[qIndex];
  if (optIndex === q.answer) correct++; else wrong++;
  updateStats();
  const card = document.getElementById(`card-${qIndex}`);
  const letters = ['a','b','c','d','e'];
  let inner = `<div class="q-header"><div class="q-num">${qIndex+1}</div><div class="q-text">${q.q}</div></div><div class="options">`;
  q.options.forEach((opt, j) => {
    let btnClass = '';
    if (j === q.answer) btnClass = optIndex === j ? 'correct' : 'reveal-correct';
    else if (j === optIndex) btnClass = 'wrong';
    inner += `<button class="option-btn ${btnClass}" disabled><span class="option-letter">${letters[j]}</span>${opt}</button>`;
  });
  inner += `</div>`;
  const ok = optIndex === q.answer;
  inner += `<div class="result-badge visible ${ok?'correct-badge':'wrong-badge'}">${ok?'✓ Correct!':'✗ Incorrect'}</div>`;
  inner += `<div class="explanation visible">💡 ${q.explanation}</div>`;
  card.innerHTML = inner;
  card.className = `q-card ${ok?'answered-correct':'answered-wrong'}`;
}

function updateStats() {
  const answered = Object.values(state).filter(v => v !== null).length;
  document.getElementById('score-display').textContent = `${correct} / ${answered}`;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-unanswered').textContent = TOTAL - answered;
  document.getElementById('progress-bar').style.width = `${(answered/TOTAL)*100}%`;
}

function resetAll() {
  questions.forEach((_, i) => state[i] = null);
  correct = 0; wrong = 0;
  updateStats();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
