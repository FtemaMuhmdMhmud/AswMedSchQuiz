<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uvea MCQs</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f8f9fc;
    --border: #e2e8f0;
    --primary: #1a3a5c;
    --accent: #2d7dd2;
    --green: #16a34a;
    --red: #dc2626;
    --yellow: #d97706;
    --text: #1e293b;
    --muted: #64748b;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    background: var(--primary);
    color: white;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(26,58,92,0.25);
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .header-left p {
    font-size: 0.85rem;
    opacity: 0.7;
    margin-top: 4px;
  }

  .score-board {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 12px 20px;
    text-align: center;
  }

  .score-board .score-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
  }

  .score-board .score-label {
    font-size: 0.72rem;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: #e2e8f0;
    height: 4px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #60a5fa);
    transition: width 0.4s ease;
  }

  /* PART DIVIDER */
  .part-header {
    background: var(--surface);
    border-left: 4px solid var(--accent);
    margin: 36px 40px 20px;
    padding: 14px 20px;
    border-radius: 0 8px 8px 0;
  }

  .part-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--primary);
    font-weight: 700;
  }

  /* QUESTION CARD */
  .questions-container {
    flex: 1;
    padding: 0 40px 40px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  .q-card {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .q-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }

  .q-card.answered-correct {
    border-color: #86efac;
    background: #f0fdf4;
  }

  .q-card.answered-wrong {
    border-color: #fca5a5;
    background: #fff5f5;
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px 14px;
  }

  .q-num {
    background: var(--primary);
    color: white;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 0.85rem;
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .q-text {
    font-size: 0.97rem;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    padding-top: 5px;
  }

  /* OPTIONS */
  .options {
    padding: 0 20px 16px 68px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.92rem;
    color: var(--text);
    text-align: left;
    transition: all 0.15s ease;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: #eff6ff;
    transform: translateX(3px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    border-color: var(--green);
    background: #dcfce7;
    color: #15803d;
    font-weight: 600;
  }

  .option-btn.wrong {
    border-color: var(--red);
    background: #fee2e2;
    color: #b91c1c;
  }

  .option-btn.reveal-correct {
    border-color: var(--green);
    background: #dcfce7;
    color: #15803d;
    font-weight: 600;
  }

  .option-letter {
    font-weight: 700;
    font-size: 0.8rem;
    min-width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .option-btn.correct .option-letter,
  .option-btn.reveal-correct .option-letter {
    background: var(--green);
    color: white;
    border-color: var(--green);
  }

  .option-btn.wrong .option-letter {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }

  /* EXPLANATION */
  .explanation {
    margin: 0 20px 16px 68px;
    padding: 12px 16px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 8px;
    font-size: 0.88rem;
    color: #92400e;
    line-height: 1.6;
    display: none;
  }

  .explanation.visible {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  .explanation strong {
    color: #78350f;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* RESULT BADGE */
  .result-badge {
    padding: 0 20px 14px 68px;
    font-size: 0.82rem;
    font-weight: 600;
    display: none;
  }

  .result-badge.visible { display: flex; align-items: center; gap: 6px; }
  .result-badge.correct-badge { color: var(--green); }
  .result-badge.wrong-badge { color: var(--red); }

  /* FOOTER */
  footer {
    background: var(--primary);
    color: rgba(255,255,255,0.85);
    padding: 20px 40px;
    text-align: center;
    font-size: 0.82rem;
    letter-spacing: 0.5px;
  }

  footer span { opacity: 0.55; } 
  footer strong { color: white; }

  /* SUMMARY BAR */
  .summary-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 14px 40px;
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .summary-bar .stat { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-gray { background: #94a3b8; }

  .reset-btn {
    margin-left: auto;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 7px;
    padding: 7px 18px;
    font-size: 0.82rem;
    font-family: 'Source Sans 3', sans-serif;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }

  .reset-btn:hover { background: var(--accent); }

  /* PART WRAPPER */
  .part-section { max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Uvea MCQs</h1>
    <p>Uveal Tract &amp; Endophthalmitis — Question Bank</p>
  </div>
  <div class="score-board">
    <div class="score-num" id="score-display">0 / 0</div>
    <div class="score-label">Score</div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar" id="progress-bar" style="width:0%"></div>
</div>

<div class="summary-bar">
  <div class="stat"><div class="stat-dot dot-green"></div> Correct: <strong id="stat-correct">0</strong></div>

  <button class="reset-btn" onclick="resetAll()">↺ Reset All</button>
</div>

<div id="app"></div>

<footer>
  <strong>Helpers @fmm</strong> &nbsp;|&nbsp; <span>Aswan Faculty of Medicine — Ophthalmology Question Bank</span>
</footer>

<script>
const questions = [
  // Part 1
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "All of the following are part of uvea <em>except</em>:",
    options: ["Pars plicata","Pars plana","Choroid","Schwalbe's line"],
    answer: 3,
    explanation: "<strong>Schwalbe's line</strong> is the termination of Descemet's membrane at the limbus — it belongs to the cornea/trabecular meshwork, NOT the uveal tract. The uvea consists of the iris, ciliary body (pars plicata + pars plana), and choroid."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "The following is a part of uvea <em>except</em>:",
    options: ["Bowman's membrane","Iris","Ciliary body","Choroid"],
    answer: 0,
    explanation: "<strong>Bowman's membrane</strong> is the second layer of the cornea (between the epithelium and stroma). The uveal tract = iris + ciliary body + choroid."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Aqueous humour is formed by:",
    options: ["Epithelium of ciliary body","Posterior surface of iris","Lens","Pars plana"],
    answer: 0,
    explanation: "Aqueous humor is produced by the <strong>non-pigmented epithelium of the ciliary body</strong> (pars plicata) via active secretion, ultrafiltration, and diffusion."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Aqueous humor is secreted by:",
    options: ["Circulus iridis minor","Ciliary muscle","Ciliary processes","Iris crypts"],
    answer: 2,
    explanation: "<strong>Ciliary processes</strong> (part of the pars plicata of the ciliary body) are the site of aqueous humor production by their non-pigmented epithelium."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "One of the <em>earliest</em> features of anterior uveitis includes:",
    options: ["Keratic precipitates","Hypopyon","Posterior synechiae","Aqueous flare"],
    answer: 3,
    explanation: "<strong>Aqueous flare</strong> (Tyndall effect) is one of the earliest signs — it results from protein leaking into the aqueous due to breakdown of the blood-aqueous barrier. KPs, hypopyon, and synechiae appear later."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "The <em>most diagnostic</em> sign of anterior uveitis is:",
    options: ["Aqueous flare","Keratic precipitates","Constricted pupil","Raised intraocular pressure"],
    answer: 1,
    explanation: "<strong>Keratic precipitates (KPs)</strong> are the most diagnostic sign. They are clumps of inflammatory cells deposited on the corneal endothelium. Their presence and type (fine vs. mutton-fat) guide diagnosis."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "In anterior uveitis the pupil is generally:",
    options: ["Of normal size","Constricted","Dilated","Mid-dilated vertical oval"],
    answer: 1,
    explanation: "In anterior uveitis, iris sphincter irritation causes <strong>miosis (constricted pupil)</strong>. This is in contrast to acute glaucoma where the pupil is mid-dilated and fixed."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Features of iritis include all of the following, <em>except</em>:",
    options: ["Small pupil","Normal pupillary reaction","Ciliary congestion","Aqueous flare","Loss of iris pattern"],
    answer: 1,
    explanation: "<strong>Normal pupillary reaction</strong> is NOT a feature. In iritis the pupil is small (miosis) and the pupillary reaction is sluggish/absent due to synechiae and iris inflammation. All other options are genuine features."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Koeppe's nodules are found in:",
    options: ["Cornea","Sclera","Iris","Conjunctiva"],
    answer: 2,
    explanation: "<strong>Koeppe's nodules</strong> are small inflammatory nodules at the <strong>pupillary margin of the iris</strong>, seen in granulomatous uveitis. Busacca's nodules are found on the iris stroma."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Koeppe's nodules present in:",
    options: ["Granulomatous iridocyclitis","Non-granulomatous iridocyclitis","Fungal uveitis","Viral uveitis"],
    answer: 0,
    explanation: "Koeppe's nodules (and Busacca's nodules) are hallmarks of <strong>granulomatous iridocyclitis</strong> — caused by TB, sarcoidosis, syphilis, leprosy, etc. Non-granulomatous uveitis has fine dusty KPs without iris nodules."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Uveitis is characterized by all <em>except</em>:",
    options: ["Mucopurulent discharge","Small pupils","Moderate pain","Marked tenderness"],
    answer: 0,
    explanation: "<strong>Mucopurulent discharge</strong> is characteristic of bacterial conjunctivitis, NOT uveitis. Uveitis presents with watery discharge (if any), ciliary pain, miosis, and tenderness."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "Ciliary injection is <em>not</em> seen in:",
    options: ["Herpetic keratitis","Bacterial ulcer","Chronic iridocyclitis","Catarrhal conjunctivitis","Acute iridocyclitis"],
    answer: 3,
    explanation: "<strong>Catarrhal conjunctivitis</strong> causes conjunctival (superficial) injection, not ciliary (deep circumcorneal) injection. Ciliary injection indicates intraocular inflammation (keratitis, iridocyclitis)."
  },
  {
    part: "Part 1: Anatomy & Clinical Signs of Uveitis",
    q: "A middle-aged female with recurrent joint pain and recurrent attacks of pain, redness, and dropped vision. The most important diagnostic sign of <em>activity</em> is:",
    options: ["Festooned pupil","Aqueous flare and cells","Pigmented KPs","Patches of iris atrophy"],
    answer: 1,
    explanation: "<strong>Aqueous flare and cells</strong> indicate active inflammation. Festooned pupil, pigmented KPs, and iris atrophy are signs of past/inactive disease, not current activity."
  },
  // Part 2
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: '"Mutton-fat" KPs on slit lamp examination are seen in:',
    options: ["Granulomatous iridocyclitis","Non-granulomatous iridocyclitis","Choroiditis","Vitreous hemorrhage"],
    answer: 0,
    explanation: '<strong>Mutton-fat KPs</strong> are large, greasy-looking precipitates made of macrophages and epithelioid cells — pathognomonic of <strong>granulomatous iridocyclitis</strong> (TB, sarcoidosis, sympathetic ophthalmia). Non-granulomatous uveitis has fine stellate KPs.'
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "A 35-year-old male with acute painful red eye, AC cells, flare, hypopyon, KPs, synechiae, recurrent oral ulcers, genital lesions, and joint swellings. Most probable cause:",
    options: ["Behcet's disease","Vogt-Koyanagi-Harada Syndrome","Sarcoidosis","Tuberculosis"],
    answer: 0,
    explanation: "<strong>Behcet's disease</strong>: the classic triad is recurrent oral ulcers + genital ulcers + uveitis (often hypopyon uveitis). It is a systemic vasculitis common in young males from the Middle East/Asia."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Anterior uveitis is seen in association with:",
    options: ["Rheumatoid arthritis","Ankylosing spondylitis","Reiter's syndrome","All of the above"],
    answer: 3,
    explanation: "<strong>All of the above</strong>. HLA-B27–associated conditions (ankylosing spondylitis, Reiter's syndrome, reactive arthritis, psoriatic arthritis) are common causes of recurrent acute anterior uveitis. Juvenile RA (JIA) also causes uveitis."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Vogt-Koyanagi-Harada syndrome includes all <em>except</em>:",
    options: ["Vitiligo","Deafness","Poliosis","Genitourinary disorders"],
    answer: 3,
    explanation: "VKH syndrome includes: bilateral panuveitis + vitiligo + alopecia + <strong>poliosis</strong> + sensorineural <strong>deafness</strong> + tinnitus + meningismus. <strong>Genitourinary disorders</strong> are not part of this syndrome."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Adhesion of iris margin anteriorly is known as:",
    options: ["Intercalary staphyloma","Anterior synechia","Posterior staphyloma","Iris Bombe"],
    answer: 1,
    explanation: "<strong>Anterior synechia</strong> = adhesion of the iris to the cornea. Posterior synechia = iris adheres to the lens. Iris bombé occurs when 360° posterior synechiae block aqueous flow, bulging the iris forward."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Recurrent attacks of non-granulomatous uveitis lead to:",
    options: ["Secondary cataract","Band keratopathy","Persistent extensive synechiae","Phthisis bulbi","All of the above"],
    answer: 4,
    explanation: "<strong>All of the above</strong>. Recurrent uveitis can lead to: posterior subcapsular cataract, band keratopathy (calcium deposits in Bowman's layer), synechiae, secondary glaucoma, cystoid macular edema, and eventually phthisis bulbi."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Late complications of anterior uveitis <em>don't</em> include:",
    options: ["Cyclitic membrane and traction retinal detachment","Hypotony due to ciliary body atrophy","Atrophia bulbi","Central retinal artery occlusion"],
    answer: 3,
    explanation: "<strong>Central retinal artery occlusion</strong> is not a typical late complication of anterior uveitis. Anterior uveitis complications include cataract, glaucoma, band keratopathy, synechiae, cyclitic membrane, hypotony, and atrophia bulbi."
  },
  {
    part: "Part 2: Syndromes & Complications of Uveitis",
    q: "Chronic use of steroids may lead to:",
    options: ["Iris atrophy","Glaucoma","Corneal opacity","Retinopathy"],
    answer: 1,
    explanation: "Chronic topical or systemic <strong>steroid use</strong> classically causes <strong>steroid-induced glaucoma</strong> (open-angle type) and <strong>posterior subcapsular cataract</strong>. Both are important side effects to monitor."
  },
  // Part 3
  {
    part: "Part 3: Management of Uveitis",
    q: "The differential diagnosis of acute iridocyclitis includes the following conditions <em>except</em>:",
    options: ["Corneal ulcer","Open angle glaucoma","Acute conjunctivitis","Angle closure glaucoma"],
    answer: 1,
    explanation: "<strong>Open-angle glaucoma</strong> is chronic and painless — it does NOT present as an acute red eye and is not in the differential of acute iridocyclitis. The others can all mimic acute iridocyclitis."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "Most important line of treatment in iridocyclitis:",
    options: ["Atropine","Tropicamide","Steroids","Antibiotics"],
    answer: 2,
    explanation: "<strong>Steroids</strong> (topical corticosteroids) are the cornerstone of treatment — they suppress the inflammatory response. Atropine/cycloplegics are also important adjuncts to prevent synechiae and relieve ciliary spasm."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "Drug of choice for Acute Irido-cyclitis is:",
    options: ["Acetazolamide","Atropine","Antibiotics","Aspirin"],
    answer: 1,
    explanation: "<strong>Atropine</strong> (1% eye drops) is the classic drug of choice for acute iridocyclitis. It achieves mydriasis (prevents/breaks posterior synechiae), cycloplegia (relieves ciliary spasm and pain), and rest for the inflamed eye."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "Atropine sulphate 1% drop or ointment must be used in:",
    options: ["Acute conjunctivitis","Chronic conjunctivitis","Iritis","Acute congestive glaucoma"],
    answer: 2,
    explanation: "Atropine 1% is indicated in <strong>iritis</strong> to dilate the pupil and prevent posterior synechiae. It is <em>contraindicated</em> in acute congestive (angle-closure) glaucoma as mydriasis would worsen the attack."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "All statements about treatment of acute anterior uveitis are true <em>except</em>:",

    explanation: "<strong>Steroids should NOT be avoided</strong> — they are the mainstay of treatment. Topical corticosteroids reduce inflammation and prevent complications. The false statement is that steroids should be avoided."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "In the treatment of anterior uveitis, which eye drop must <em>NOT</em> be used:",

    answer: 1,
    explanation: "<strong>Topical pilocarpine</strong> (a miotic) is contraindicated. Miotics constrict the pupil, worsening synechiae formation and causing more ciliary spasm. Treatment requires mydriatics/cycloplegics, not miotics."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "One of the following is considered <em>contraindicated</em> in acute anterior uveitis:",
    options: ["Timolol","Atropine","Steroids","Cyclopentolate"],
    answer: 0,
    explanation: "<strong>Timolol</strong> (a beta-blocker) is not directly contraindicated in uveitis itself, but <em>miotics like pilocarpine</em> are classically contraindicated. Among the options, Timolol is the only one not part of standard uveitis treatment. Atropine, steroids, and cyclopentolate are all indicated."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "The most accepted regimen in drug therapy of anterior uveitis:",
    options: ["Corticosteroids and antibiotics","Corticosteroids and miotics","Corticosteroids and Cycloplegics","Corticosteroids and nonsteroidal anti-inflammatory drugs"],

  },
  {
    part: "Part 3: Management of Uveitis",
    q: "In treatment of glaucoma secondary to iridocyclitis, we give all these topical drugs <em>except</em>:",

    answer: 1,

  },
  {

    q: "Secondary glaucoma due to acute attack of irido-cyclitis can be managed by the following <em>except</em>:",

    answer: 3,
    explanation: "<strong>Miotics (e.g., pilocarpine)</strong> are contraindicated in iridocyclitis-related glaucoma. They promote synechiae formation and worsen inflammation. The IOP is managed with steroids, beta-blockers, and CAIs."
  },
  {
    part: "Part 3: Management of Uveitis",
    q: "Glaucoma secondary to cycloiritis — take all these medications <em>except</em>:",
    options: ["Atropine","Miotics","Beta blockers","Carbonic anhydrase inhibitors"],
    answer: 1,
    explanation: "<strong>Miotics</strong> are again the answer. Atropine is given to maintain mydriasis and break/prevent synechiae. Beta-blockers and CAIs lower IOP. Miotics (like pilocarpine) are absolutely avoided."
  },
  // Part 4
  {
    part: "Part 4: Endophthalmitis & Uveal Tumors",
    q: "After 48 hours of cataract extraction, patient has ocular pain, visual loss, red eye with ciliary injection, corneal edema, and absent red reflex. First suspicion:",
    options: ["Secondary glaucoma","Anterior uveitis","Bacterial endophthalmitis","Acute conjunctivitis"],
    answer: 2,
    explanation: "<strong>Bacterial endophthalmitis</strong> is the most feared early post-operative complication. Classic triad: pain + visual loss + absent red reflex within 1–7 days of surgery. Urgent vitreous tap + intravitreal antibiotics (vancomycin + ceftazidime) are required."
  },
  {
    part: "Part 4: Endophthalmitis & Uveal Tumors",
    q: "A diabetic male, 2 weeks after cataract extraction: severe painful red eye, yellowish pupil, proptosis, total ophthalmoplegia, no light perception. Recommended treatment:",
    options: ["Systemic and local antibiotic","Atropine and topical steroid","Evisceration","Vitrectomy and intravitreal injection of antibiotic"],
    answer: 2,
    explanation: "<strong>Evisceration</strong> is indicated here. This presentation — proptosis, total ophthalmoplegia, no light perception, and orbital involvement — is consistent with <strong>panophthalmitis</strong>, which extends beyond the eye. Treatment = endophthalmitis treatment + evisceration."
  },
  {
    part: "Part 4: Endophthalmitis & Uveal Tumors",
    q: "The most common primarily intraocular malignancy in adults is:",
    options: ["Retinoblastoma","Choroidal melanoma","Squamous cell carcinoma of conjunctiva","Iris naevus"],
    answer: 1,
    explanation: "<strong>Choroidal melanoma</strong> is the most common primary intraocular malignancy in adults. Retinoblastoma is the most common in children. It arises from choroidal melanocytes and may cause serous retinal detachment."
  }
];

let state = {};
let correct = 0, wrong = 0;

function init() {
  questions.forEach((_, i) => state[i] = null);
  correct = 0; wrong = 0;
  updateStats();
  render();
}

function render() {
  const app = document.getElementById('app');
  const parts = {};
  questions.forEach((q, i) => {
    if (!parts[q.part]) parts[q.part] = [];
    parts[q.part].push({ q, i });
  });

  let html = '';
  Object.entries(parts).forEach(([part, items]) => {
    html += `<div class="part-section"><div class="part-header"><h2>${part}</h2></div><div class="questions-container">`;
    items.forEach(({ q, i }) => {
      const letters = ['a','b','c','d','e','f'];
      let cardClass = '';
      if (state[i] !== null) {
        cardClass = state[i] === q.answer ? 'answered-correct' : 'answered-wrong';
      }
      html += `<div class="q-card ${cardClass}" id="card-${i}">
        <div class="q-header">
          <div class="q-num">${i+1}</div>
          <div class="q-text">${q.q}</div>
        </div>
        <div class="options">`;
      q.options.forEach((opt, j) => {
        let btnClass = '';
        if (state[i] !== null) {
          if (j === q.answer) btnClass = state[i] === j ? 'correct' : 'reveal-correct';
          else if (j === state[i]) btnClass = 'wrong';
        }
        html += `<button class="option-btn ${btnClass}" ${state[i]!==null?'disabled':''} onclick="answer(${i},${j})">
          <span class="option-letter">${letters[j]}</span>${opt}
        </button>`;
      });
      html += `</div>`;
      // result badge
      if (state[i] !== null) {
        const isCorrect = state[i] === q.answer;
        html += `<div class="result-badge visible ${isCorrect?'correct-badge':'wrong-badge'}">${isCorrect ? '✓ Correct!' : '✗ Incorrect'}</div>`;
      } else {
        html += `<div class="result-badge"></div>`;
      }
      // explanation
      const expVisible = state[i] !== null ? 'visible' : '';
      html += `<div class="explanation ${expVisible}">💡 ${q.explanation}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  app.innerHTML = html;
}

function answer(qIndex, optIndex) {
  if (state[qIndex] !== null) return;
  state[qIndex] = optIndex;
  const q = questions[qIndex];
  if (optIndex === q.answer) correct++; else wrong++;
  updateStats();
  // Re-render only the card
  const card = document.getElementById(`card-${qIndex}`);
  const letters = ['a','b','c','d','e','f'];
  let inner = `<div class="q-header"><div class="q-num">${qIndex+1}</div><div class="q-text">${q.q}</div></div><div class="options">`;
  q.options.forEach((opt, j) => {
    let btnClass = '';
    if (j === q.answer) btnClass = optIndex === j ? 'correct' : 'reveal-correct';
    else if (j === optIndex) btnClass = 'wrong';
    inner += `<button class="option-btn ${btnClass}" disabled><span class="option-letter">${letters[j]}</span>${opt}</button>`;
  });
  inner += `</div>`;
  const isCorrect = optIndex === q.answer;
  inner += `<div class="result-badge visible ${isCorrect?'correct-badge':'wrong-badge'}">${isCorrect?'✓ Correct!':'✗ Incorrect'}</div>`;
  inner += `<div class="explanation visible">💡 ${q.explanation}</div>`;
  card.innerHTML = inner;
  card.className = `q-card ${isCorrect?'answered-correct':'answered-wrong'}`;
}

function updateStats() {
  const answered = Object.values(state).filter(v => v !== null).length;
  const unanswered = questions.length - answered;
  document.getElementById('score-display').textContent = `${correct} / ${answered}`;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-unanswered').textContent = unanswered;
  document.getElementById('progress-bar').style.width = `${(answered/questions.length)*100}%`;
}

function resetAll() {
  questions.forEach((_, i) => state[i] = null);
  correct = 0; wrong = 0;
  updateStats();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
</body>
</html>
